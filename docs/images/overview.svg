<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Codex 额度显示</title>
  <desc id="desc">在模型名称旁查看剩余额度与重置时间。Windows 本地工具，支持额度切换、清晰文字和自动显示。图中界面为示意。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c2c"/><stop offset="1" stop-color="#162f35"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#b0f6d2"/><stop offset="1" stop-color="#78dccb"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b0f6d2" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="600" rx="28" fill="url(#grid)"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="64" y="52" width="170" height="32" rx="16" fill="#b0f6d2" fill-opacity=".12"/>
    <circle cx="83" cy="68" r="4" fill="#b0f6d2"/>
    <text x="98" y="74" fill="#b0f6d2" font-size="13" letter-spacing="1">WINDOWS · LOCAL</text>
    <text x="64" y="163" fill="#f2f6f8" font-size="54" font-weight="600">Codex 额度显示</text>
    <text x="66" y="212" fill="#bbccd3" font-size="24">剩余多少，何时重置。就在模型名称旁。</text>
    <rect x="64" y="264" width="1152" height="164" rx="20" fill="#ffffff"/>
    <rect x="64.5" y="264.5" width="1151" height="163" rx="20" fill="none" stroke="#d5e2e5"/>
    <text x="97" y="301" fill="#71808c" font-size="13" letter-spacing="1">界面示意</text>
    <g fill="#282828" font-size="26">
      <text x="254" y="365">04:42:27</text>
      <text x="553" y="365">62%</text>
      <path d="M674 339l-12 17h10l-3 14 18-22h-11l4-9z" fill="#202326"/>
      <text x="704" y="365">6.1 Sol <tspan fill="#909090">High</tspan></text>
      <path d="M922 352l6 6 6-6" fill="none" stroke="#909090" stroke-width="2"/>
    </g>
    <path d="M252 389h126M551 389h54" stroke="#56b998" stroke-width="3" stroke-linecap="round"/>
    <text x="64" y="492" fill="#b0f6d2" font-size="18">重置倒计时</text>
    <text x="278" y="492" fill="#b0f6d2" font-size="18">剩余额度</text>
    <text x="480" y="492" fill="#b0f6d2" font-size="18">跟随 Codex 显示</text>
    <text x="761" y="492" fill="#b0f6d2" font-size="18">一键安装</text>
    <path d="M64 522h1152" stroke="#f2f6f8" stroke-opacity=".12"/>
    <text x="64" y="560" fill="#94abb6" font-size="14">5 小时 / 周额度切换 · Segoe UI 字体 · DPI 缩放 · 自动后台启动</text>
    <text x="1216" y="560" text-anchor="end" fill="#94abb6" font-size="14">v1.0.0</text>
  </g>
</svg>
